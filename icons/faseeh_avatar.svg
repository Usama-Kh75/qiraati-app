<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
    <!-- ظل القلم فصيح -->
    <ellipse cx="80" cy="190" rx="45" ry="8" fill="rgba(0,0,0,0.15)" />
    <!-- الممحاة الحمراء اللطيفة في الأعلى -->
    <rect x="52" y="15" width="56" height="28" rx="8" fill="#e11d48" stroke="#be123c" stroke-width="3" />
    <!-- الطوق المعدني -->
    <rect x="50" y="38" width="60" height="12" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="2" />
    <!-- جسم القلم الأصفر الخشبي -->
    <path d="M52 48 L108 48 L102 145 L58 145 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3" />
    <path d="M72 48 L88 48 L85 145 L75 145 Z" fill="#fef08a" opacity="0.6" />
    <!-- سن الخشب المشحوذ -->
    <polygon points="58,145 102,145 80,185" fill="#fed7aa" stroke="#d97706" stroke-width="2" />
    <!-- سن الرصاص الأسود -->
    <polygon points="74,174 86,174 80,185" fill="#1e293b" />
    <!-- العين اليمنى الكبيرة -->
    <g class="mascot-eye">
        <ellipse cx="68" cy="80" rx="10" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
        <circle cx="70" cy="81" r="6" fill="#1e3a8a" />
        <circle cx="72" cy="78" r="2.5" fill="#ffffff" />
    </g>
    <!-- العين اليسرى الكبيرة -->
    <g class="mascot-eye">
        <ellipse cx="92" cy="80" rx="10" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
        <circle cx="90" cy="81" r="6" fill="#1e3a8a" />
        <circle cx="88" cy="78" r="2.5" fill="#ffffff" />
    </g>
    <!-- الحواجب البهية -->
    <path d="M60 62 Q68 58 76 64" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
    <path d="M84 64 Q92 58 100 62" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
    <!-- الخدود الوردية المبهجة -->
    <ellipse cx="58" cy="98" rx="6" ry="4" fill="#f43f5e" opacity="0.5" />
    <ellipse cx="102" cy="98" rx="6" ry="4" fill="#f43f5e" opacity="0.5" />
    <!-- الابتسامة المشرقة -->
    <path d="M70 102 Q80 116 90 102" fill="#be123c" stroke="#1e293b" stroke-width="2" />
    <!-- اليدان البيضاوان الصغيرتان الملوحتان -->
    <g>
        <circle cx="40" cy="100" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
        <circle cx="34" cy="95" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
        <circle cx="120" cy="100" r="11" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
        <circle cx="126" cy="95" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    </g>
</svg>